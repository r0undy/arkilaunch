name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Typecheck resolves workspace imports via each package's built .d.ts, so build first.
      - name: Build workspace packages the typecheck resolves against
        run: pnpm -r --filter=./packages/* build
      - run: pnpm typecheck
      - run: pnpm build

  web-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arkilaunch/shared build
      - run: pnpm --filter @arkilaunch/web test

  node-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arkilaunch/shared build
      - run: pnpm --filter @arkilaunch/shared test
      - run: pnpm --filter @arkilaunch/document-intelligence test
      - run: pnpm --filter @arkilaunch/weather test

  api-integration-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway credentials for an ephemeral container; never reuse for a real environment.
      APP_AUTHENTICATED_PASSWORD: ci_throwaway_not_a_secret
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
      # Must be app_authenticated, not postgres: superusers bypass RLS and isolation tests pass vacuously.
      DATABASE_URL_POOLED: postgresql://app_authenticated:ci_throwaway_not_a_secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages the apps import
        run: pnpm -r --filter=./packages/* build
      - name: Generate a throwaway RS256 keypair
        # The suite un-escapes literal \n, so the PEM is flattened to one line.
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.key
          openssl rsa -in /tmp/jwt.key -pubout -out /tmp/jwt.pub
          echo "JWT_PRIVATE_KEY=$(sed -z 's/\n/\\n/g' /tmp/jwt.key)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$(sed -z 's/\n/\\n/g' /tmp/jwt.pub)" >> "$GITHUB_ENV"
      - name: Apply migrations and set the app_authenticated password
        run: pnpm --filter @arkilaunch/db migrate
      - name: Seed the two-tenant isolation fixtures
        run: pnpm db:seed:test
      - name: apps/api suite
        run: pnpm --filter @arkilaunch/api test
      - name: jobs suite
        run: pnpm --filter @arkilaunch/jobs test
      - name: packages/db pooler-independent suites
        # Explicit file list so a security test can't vanish via a runtime skip;
        # guc-pooler-leak.spec.ts needs Supavisor and runs in cross-tenant-isolation-suite.
        run: >-
          pnpm --filter @arkilaunch/db exec vitest run
          test/tenant-isolation.spec.ts
          test/rls-enumeration.spec.ts
          test/audit-log-immutability.spec.ts
          test/after-commit.spec.ts
          test/seed-identities.spec.ts
          src/deposit-ledger.spec.ts
          src/diesel-gaswatch.spec.ts
          src/send-email.spec.ts

  migration-expand-contract-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a throwaway Postgres 17
        run: pnpm --filter @arkilaunch/db migrate
        env:
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build the shared package the seed imports
        run: pnpm --filter @arkilaunch/shared build

      # Run twice: the second run proves the seed is idempotent.
      - name: Anchor seed runs, and is idempotent
        run: |
          pnpm --filter @arkilaunch/db seed:anchor
          pnpm --filter @arkilaunch/db seed:anchor
        env:
          # localhost, so assertSeedTargetIsLocal() permits the weak dev credentials.
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres

  cross-tenant-isolation-suite:
    runs-on: ubuntu-latest
    # QAD §3: the GUC-no-leak test needs the Supavisor pooler, so this runs against the live project.
    if: ${{ vars.RUN_LIVE_DB_TESTS == 'true' }}
    needs: migration-expand-contract-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:seed:test
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # Deliberate opt-in: this seeds the fixed-password test tenants into the live project.
          ALLOW_WEAK_SEED_CREDENTIALS: 'true'
      - run: pnpm test
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}

  ocr-accuracy-gate:
    runs-on: ubuntu-latest
    # QAD-T39: proves assertAccuracyGate() fails closed; does not assert >= 90.06%
    # until a real golden set and trained model exist.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages the harness imports
        run: pnpm -r --filter=./packages/* build
      - name: Accuracy metric + threshold enforcement
        run: >-
          pnpm --filter @arkilaunch/shared exec vitest run
          src/ocr-accuracy.spec.ts

  newman-api-suite:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "skipped: needs a committed Postman collection; assertions currently covered by payments-engine.spec.ts + money-path-e2e"'

  money-path-e2e:
    runs-on: ubuntu-latest
    # QAD-T26 / QAD-T40 (RFC-2): no deduction without reconciliation.
    # Named files so a money-path test can't vanish via a runtime skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway credentials for an ephemeral container; never reuse for a real environment.
      APP_AUTHENTICATED_PASSWORD: ci_throwaway_not_a_secret
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
      # Must be app_authenticated, not postgres: superusers bypass RLS and isolation tests pass vacuously.
      DATABASE_URL_POOLED: postgresql://app_authenticated:ci_throwaway_not_a_secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages the apps import
        run: pnpm -r --filter=./packages/* build
      - name: Generate a throwaway RS256 keypair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.key
          openssl rsa -in /tmp/jwt.key -pubout -out /tmp/jwt.pub
          echo "JWT_PRIVATE_KEY=$(sed -z 's/\n/\\n/g' /tmp/jwt.key)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$(sed -z 's/\n/\\n/g' /tmp/jwt.pub)" >> "$GITHUB_ENV"
      - name: Apply migrations and set the app_authenticated password
        run: pnpm --filter @arkilaunch/db migrate
      - name: Seed the two-tenant isolation fixtures
        run: pnpm db:seed:test
      - name: OCR -> reconciliation -> deduction gate (QAD-T26, QAD-T40)
        run: >-
          pnpm --filter @arkilaunch/api exec vitest run
          test/money-path.spec.ts
          test/edtr-engine.spec.ts
      - name: Reconciliation gate through the OCR worker
        run: >-
          pnpm --filter @arkilaunch/jobs exec vitest run
          src/edtr-ocr-worker.spec.ts
      - name: Tenant isolation and reference-table privilege (RFC-1 §3)
        run: >-
          pnpm --filter @arkilaunch/db exec vitest run
          test/rls-enumeration.spec.ts
          test/tenant-isolation.spec.ts

  console-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway credentials for an ephemeral container; never reuse for a real environment.
      APP_AUTHENTICATED_PASSWORD: ci_throwaway_not_a_secret
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_POOLED: postgresql://app_authenticated:ci_throwaway_not_a_secret@localhost:5432/postgres
      SEED_PASSWORD: ci_throwaway_not_a_secret
      # StorageService reads these at boot; nothing uploads, they only have to exist.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ci_throwaway_not_a_secret
      SUPABASE_STORAGE_BUCKET_EQUIPMENT: equipment-photos
      # One loopback IP for the whole suite; the real 30/min catalog limit would 429.
      PUBLIC_CATALOG_THROTTLE_LIMIT: "2000"
      # Plain HTTP (no dev cert in CI); HTTPS would block the http://localhost:3000 API as mixed content.
      # Bare localhost is the platform; Chromium resolves *.localhost to loopback.
      PLAYWRIGHT_BASE_URL: http://almara.localhost:5173
      # Must match vite's origin (API CORS default).
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages the apps import
        run: pnpm -r --filter=./packages/* build
      - name: Generate a throwaway RS256 keypair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.key
          openssl rsa -in /tmp/jwt.key -pubout -out /tmp/jwt.pub
          echo "JWT_PRIVATE_KEY=$(sed -z 's/\n/\\n/g' /tmp/jwt.key)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$(sed -z 's/\n/\\n/g' /tmp/jwt.pub)" >> "$GITHUB_ENV"
      - name: Apply migrations and set the app_authenticated password
        run: pnpm --filter @arkilaunch/db migrate
      - name: Seed the anchor tenant and its sign-in accounts
        run: pnpm db:seed
      - name: Build the API
        run: pnpm --filter @arkilaunch/api build
      - run: pnpm --filter @arkilaunch/web exec playwright install --with-deps chromium
      - name: Start the API and wait for it
        run: |
          pnpm start:api > /tmp/api.log 2>&1 &
          # Dump the log so a boot crash isn't a silent 90s timeout.
          npx --yes wait-on http://localhost:3000/health --timeout 90000 || {
            echo "::error::The API did not come up. Its output follows."
            cat /tmp/api.log
            exit 1
          }
      - name: Browser specs (desktop + Pixel 5)
        run: pnpm --filter @arkilaunch/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
