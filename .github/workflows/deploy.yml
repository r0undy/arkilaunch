name: Deploy

# `main` is not a trigger: prod is unprovisioned, and the push-before-apply order
# needs the registry to exist. Create prod's registry with one manual apply first.
on:
  push:
    branches: [dev]
  pull_request:
    paths: ['infra/terraform/**']

permissions:
  id-token: write # OIDC federated credential -- see infra/terraform/bootstrap/README.md §3
  contents: read

jobs:
  # Plan-only; gates `deploy` on push. base_ref is empty on push, so fall back to ref_name.
  terraform-plan:
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - run: terraform plan -var image_tag=${{ github.sha }}
        env:
          TF_VAR_database_url_direct: ${{ secrets.DATABASE_URL_DIRECT }}
          TF_VAR_database_url_pooled: ${{ secrets.DATABASE_URL_POOLED }}
          TF_VAR_app_authenticated_password: ${{ secrets.APP_AUTHENTICATED_PASSWORD }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_paymongo_secret_key: ${{ secrets.PAYMONGO_SECRET_KEY }}
          TF_VAR_paymongo_webhook_secret: ${{ secrets.PAYMONGO_WEBHOOK_SECRET }}
          TF_VAR_ors_api_key: ${{ secrets.ORS_API_KEY }}
          TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}

  deploy:
    if: github.event_name == 'push'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    env:
      ENV_NAME: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      # Push before apply so the Container App never points at a tag ACR hasn't seen.
      - name: Build and push image
        working-directory: .
        run: |
          az acr login --name acrarkilaunch${{ env.ENV_NAME }}
          docker build -t acrarkilaunch${{ env.ENV_NAME }}.azurecr.io/arkilaunch-backend:${{ github.sha }} .
          docker push acrarkilaunch${{ env.ENV_NAME }}.azurecr.io/arkilaunch-backend:${{ github.sha }}

      # Migrate before apply (which rolls the new image); migrations are expand-only.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run database migrations
        working-directory: .
        run: pnpm db:migrate
        env:
          # Session-mode direct URL: the transaction pooler can't carry prepared statements.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # Required: migrate.ts only warns if absent, leaving app_authenticated with a stale password.
          APP_AUTHENTICATED_PASSWORD: ${{ secrets.APP_AUTHENTICATED_PASSWORD }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - run: terraform apply -auto-approve -var image_tag=${{ github.sha }}
        env:
          TF_VAR_database_url_direct: ${{ secrets.DATABASE_URL_DIRECT }}
          TF_VAR_database_url_pooled: ${{ secrets.DATABASE_URL_POOLED }}
          TF_VAR_app_authenticated_password: ${{ secrets.APP_AUTHENTICATED_PASSWORD }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_paymongo_secret_key: ${{ secrets.PAYMONGO_SECRET_KEY }}
          TF_VAR_paymongo_webhook_secret: ${{ secrets.PAYMONGO_WEBHOOK_SECRET }}
          TF_VAR_ors_api_key: ${{ secrets.ORS_API_KEY }}
          TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}

  # After `deploy` so the frontend never ships ahead of the API and its CORS.
  web:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # VITE_* is inlined at build time; absolute URL, no same-origin /api proxy.
      - run: pnpm --filter @arkilaunch/shared build && pnpm --filter @arkilaunch/web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Public by design; the secret half is TF_VAR_turnstile_secret_key.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - run: pnpm --filter @arkilaunch/web exec wrangler deploy --var "API_BASE_URL:${{ vars.VITE_API_BASE_URL }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
