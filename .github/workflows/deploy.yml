name: Deploy

# push to `dev` -> deploy the dev environment; push to `main` -> deploy prod.
# `.github/workflows/ci.yml`'s lint/typecheck/test/build gate is unchanged
# and still runs on every PR -- this workflow only builds/deploys.
on:
  push:
    branches: [dev, main]
  pull_request:
    paths: ['infra/terraform/**']

permissions:
  id-token: write # OIDC federated credential -- see infra/terraform/bootstrap/README.md §3
  contents: read

jobs:
  # Runs on any PR touching infra/terraform/**, and on every deploying push,
  # against whichever environment the target branch maps to. Never applies.
  # On push it is what `deploy` gates on: a plan that errors stops the apply
  # before an image is built or a migration runs.
  #
  # `github.base_ref` is set only on pull_request, and is empty on push, so
  # the fallback picks the branch being pushed.
  terraform-plan:
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - run: terraform plan -var image_tag=${{ github.sha }}
        env:
          TF_VAR_database_url_direct: ${{ secrets.DATABASE_URL_DIRECT }}
          TF_VAR_database_url_pooled: ${{ secrets.DATABASE_URL_POOLED }}
          TF_VAR_app_authenticated_password: ${{ secrets.APP_AUTHENTICATED_PASSWORD }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_paymongo_secret_key: ${{ secrets.PAYMONGO_SECRET_KEY }}
          TF_VAR_paymongo_webhook_secret: ${{ secrets.PAYMONGO_WEBHOOK_SECRET }}

  deploy:
    if: github.event_name == 'push'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    env:
      ENV_NAME: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      # Build/push happens before terraform apply so the image the apply
      # references (image_tag=$GITHUB_SHA) already exists in the registry --
      # apply would otherwise create/update a Container App pointing at a
      # tag ACR has never seen.
      - name: Build and push image
        working-directory: .
        run: |
          az acr login --name acrarkilaunch${{ env.ENV_NAME }}
          docker build -t acrarkilaunch${{ env.ENV_NAME }}.azurecr.io/arkilaunch-backend:${{ github.sha }} .
          docker push acrarkilaunch${{ env.ENV_NAME }}.azurecr.io/arkilaunch-backend:${{ github.sha }}

      # Migrations run after the image exists but before `terraform apply`,
      # because apply is what rolls the API revision and the cron jobs onto
      # the new image. Applying first would leave new code reading a schema
      # that is not there yet. Migrations here are expand-only and idempotent
      # (docs/cr-arkilaunch-m4-money-path-gates.md), so the old revision
      # tolerates the new schema for the length of the apply.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run database migrations
        working-directory: .
        run: pnpm db:migrate
        env:
          # Direct connection, session mode. The pooled URL is transaction
          # mode and cannot carry the prepared statements the migrator needs.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # Not optional in practice: packages/db/src/migrate.ts only warns
          # when this is absent, so omitting it would leave the step green
          # while app_authenticated keeps a stale password and every pooled
          # runtime connection fails.
          APP_AUTHENTICATED_PASSWORD: ${{ secrets.APP_AUTHENTICATED_PASSWORD }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - run: terraform apply -auto-approve -var image_tag=${{ github.sha }}
        env:
          TF_VAR_database_url_direct: ${{ secrets.DATABASE_URL_DIRECT }}
          TF_VAR_database_url_pooled: ${{ secrets.DATABASE_URL_POOLED }}
          TF_VAR_app_authenticated_password: ${{ secrets.APP_AUTHENTICATED_PASSWORD }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_paymongo_secret_key: ${{ secrets.PAYMONGO_SECRET_KEY }}
          TF_VAR_paymongo_webhook_secret: ${{ secrets.PAYMONGO_WEBHOOK_SECRET }}
